name: Refresh profile graphics
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render graphics with GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ramkarthik77
        run: python3 scripts/render.py
      - name: Commit refreshed graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution telemetry"
            git push
          fi
